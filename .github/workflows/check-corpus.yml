name: check-corpus
# Runs the corpus consistency check (tools/check-corpus.py) on every push
# and pull request: registry <-> data files, unit numbering, citation grid,
# link anchors, Atlas resolution, module counts, documentation presence.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Corpus consistency check
        run: python tools/check-corpus.py
